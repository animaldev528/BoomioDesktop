name: Desktop Windows (test build)

# A hand-run Windows build of this fork, for trying it on a real machine.
#
# ⚠️ **Why this exists next to `desktop-release.yml` rather than inside it.** That workflow is
# upstream's signing and publishing pipeline: it pulls `local.properties` out of a repository
# secret, uploads source bundles to Sentry, refuses to run when any of that is missing, and gates on
# a `desktop-release` environment. None of it is configured on this fork, and none of it is needed
# to answer "does the tunnel work on Windows". This one takes its deployment settings as inputs,
# builds unsigned, and hands back a zip.
#
# ⚠️ **The step that matters is `Build the overlay tunnel library`.** The Go tunnel is the thing
# that has never existed for Windows: without `overlaywg.dll` the app installs and runs as a plain
# media client, and every boomio feature is inert — enrollment wants the device key that library
# mints, and the tunnel, the relay and the certificate all hang off enrollment.
# `overlaywg/build-desktop.sh` already knows how to build it for `MINGW*`; nothing had ever called
# it on Windows.
on:
  workflow_dispatch:
    inputs:
      boomio_base_url:
        description: "Media-plane base of the box: the origin plus the path bsf lives at, e.g. https://home.duckdns.org/bsf. An origin alone is normalised to <origin>/bsf (required for pairing and casting)"
        required: true
        type: string
      supabase_url:
        description: "Supabase URL for sign-in (optional; blank leaves sign-in inert)"
        required: false
        type: string
        default: ""
      supabase_anon_key:
        description: "Supabase anon key (optional; needed for sign-in)"
        required: false
        type: string
        default: ""
      package_as:
        description: "zip = unzip and run the .exe; msi = an installer"
        required: true
        type: choice
        options:
          - zip
          - msi
        default: zip

permissions:
  contents: read

concurrency:
  group: desktop-windows-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 (unsigned)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # Read by `runtimeConfigValue` in composeApp/build.gradle.kts, which prefers
      # local.properties and falls back to the environment. That is what bakes the deployment into
      # BoomioConfig; without it the build is the stock app and `startLink` refuses.
      BOOMIO_BASE_URL: ${{ inputs.boomio_base_url }}
      NUVIO_SUPABASE_URL: ${{ inputs.supabase_url }}
      NUVIO_SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Fetch Windows runtime
        shell: bash
        run: |
          # libmpv and the player bridge runtime are Git LFS objects inherited from upstream.
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if [[ ! -f "${runtime_path}" ]]; then
            echo "The bundled Windows libmpv runtime is missing." >&2
            exit 1
          fi
          runtime_size="$(wc -c < "${runtime_path}")"
          if (( runtime_size < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        # Pinned to a full version, not `@v6`: this repository publishes `v6.x.y` patch tags and no
        # floating major tag, so `@v6` resolves to nothing and the job dies before it builds.
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # ⚠️ Not `go version` from the image: the runner carries Go 1.24.13 and `overlaywg/go.mod`
          # declares `go 1.26.0`. Reading the version from the module keeps the two from drifting,
          # and gets the right toolchain installed instead of relying on GOTOOLCHAIN to fetch it.
          go-version-file: overlaywg/go.mod
          cache: false

      - name: Set up MinGW
        shell: pwsh
        run: |
          # ⚠️ Measured 2026-11-07: `choco install mingw` failed the whole run with
          # "503 (Service Unavailable)" from the chocolatey community feed, before anything was
          # built. The image already carries MSYS2, so prefer a gcc that is already on disk and
          # only reach for a package manager when it is not.
          $candidates = @(
            "C:\msys64\mingw64\bin\gcc.exe",
            "C:\ProgramData\mingw64\mingw64\bin\gcc.exe"
          )
          $gcc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gcc) {
            $msysBash = "C:\msys64\usr\bin\bash.exe"
            if (Test-Path $msysBash) {
              & $msysBash -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-gcc" | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "pacman could not install mingw-w64-x86_64-gcc" }
              $gcc = "C:\msys64\mingw64\bin\gcc.exe"
            } else {
              choco install mingw --no-progress -y
              $gcc = Get-ChildItem "$env:ProgramData\chocolatey\lib\mingw\tools\install" -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }
          if (-not $gcc -or -not (Test-Path $gcc)) { throw "no MinGW gcc was found on the image" }
          $binPath = Split-Path $gcc
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $gcc --version | Select-Object -First 1
          go version

      - name: Build the overlay tunnel library
        shell: bash
        run: |
          # ⚠️ The whole point of this workflow. `build-desktop.sh` reads `uname -s`, which under Git
          # Bash on a Windows runner is `MINGW64_NT-...` — the branch it already handles.
          CGO_ENABLED=1 ./overlaywg/build-desktop.sh
          dll="overlaywg/build/windows-amd64/overlaywg.dll"
          if [[ ! -f "${dll}" ]]; then
            echo "overlaywg/build-desktop.sh did not produce ${dll}" >&2
            exit 1
          fi
          echo "built ${dll}: $(wc -c < "${dll}") bytes"
          # Prove the C ABI is really there rather than trusting the byte count. These are the ten
          # names OverlayWgBinding.kt resolves through JNA, spelled exactly as `//export` writes
          # them -- `OverlayWg_`, not `overlaywg_`: the first version of this check grepped for the
          # wrong case and failed a perfectly good 13 MB DLL.
          for sym in OverlayWg_GenerateKeypair OverlayWg_Up OverlayWg_Down OverlayWg_Status \
                     OverlayWg_Dial OverlayWg_Read OverlayWg_Write OverlayWg_Close \
                     OverlayWg_LastError OverlayWg_Free; do
            if ! grep -aq "$sym" "${dll}"; then
              echo "The DLL does not export ${sym}." >&2
              exit 1
            fi
          done
          echo "all ten overlaywg exports present"

      - name: Set up MSVC
        # The player bridge is compiled with `cl`, which a Windows runner does not put on PATH:
        # without this the Gradle step dies with "Process 'command 'cmd'' finished with non-zero
        # exit value 1" and the real reason buried in the build script's echo.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch the WebView2 SDK
        shell: pwsh
        run: |
          # `buildWindowsPlayerBridge` compiles against WebView2.h and links WebView2Loader.dll.lib.
          # It looks for them under ~/.nuget/packages/microsoft.web.webview2/<version>, which only
          # exists on a machine that has restored the package. There is no `nuget` on the image, so
          # fetch the package straight from the feed; it is a zip.
          $ver = "1.0.4314.35"
          $zip = Join-Path $env:RUNNER_TEMP "webview2.zip"
          $dir = Join-Path $env:RUNNER_TEMP "webview2"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$ver" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $header = Join-Path $dir "build/native/include/WebView2.h"
          $implib = Join-Path $dir "build/native/x64/WebView2Loader.dll.lib"
          if (-not (Test-Path $header)) { throw "WebView2.h is missing from the package at $header" }
          if (-not (Test-Path $implib)) { throw "WebView2Loader.dll.lib is missing from the package at $implib" }
          "WEBVIEW2_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "WebView2 $ver at $dir"

      # ⚠️ `BOOMIO_BASE_URL` is the **media plane**, not the box's origin: `BoomioStreamResolver`
      # appends `/find/...` to it, and this deployment collapses every service onto one origin told
      # apart by path (`…/bsf`, `…/bsc`, `…/bsm`). Built from the bare origin, `/find` returns the
      # dashboard's HTML with a 404, no streams parse out of it, and casting fails with "no stream
      # could be prepared" — and `bsmTelemetryBaseUrl`, which derives from the `/bsf` sibling, comes
      # out blank, so the device never reports in. An origin alone is therefore normalised here
      # rather than left to whoever dispatches the build.
      - name: Resolve media-plane URL
        id: media
        shell: bash
        run: |
          base="${BOOMIO_BASE_URL%/}"
          rest="${base#*://}"
          if [ "$rest" = "$base" ]; then
            echo "::error::BOOMIO_BASE_URL must start with http:// or https://"
            exit 1
          fi
          if [ "${rest#*/}" = "$rest" ]; then
            base="$base/bsf"
            echo "No path in the input; using the collapsed edge's media plane at ${base}"
          fi
          echo "url=${base}" >> "$GITHUB_OUTPUT"
          echo "media plane: ${base}"

      - name: Check the media plane answers
        shell: bash
        # Not fatal: a runner that cannot reach the house says nothing about the machine the build
        # is for. But a base that 404s produces a build whose cast button can never work, so it is
        # worth saying loudly at build time instead of discovering it from the player.
        run: |
          url="${{ steps.media.outputs.url }}/find/tt0111161"
          # `|| true`: curl still writes its status line when it fails, and a failed
          # `&&`-chain would otherwise leave the literal fallback concatenated onto it.
          code="$(curl -s -o media.json -w '%{http_code}' --max-time 20 "${url}" || true)"
          code="${code:-000}"
          if [ "${code}" != "200" ]; then
            echo "::warning::${url} answered ${code}; casting and boomio streams will fail in this build"
          else
            echo "${url} answered 200 ($(wc -c < media.json) bytes)"
          fi

      - name: Build distributable
        shell: pwsh
        env:
          # Step-level wins over the job-level value, so this is the normalised one.
          BOOMIO_BASE_URL: ${{ steps.media.outputs.url }}
        run: |
          # ⚠️ `generateRuntimeConfigs` declares `local.properties` as a required input file, and it
          # is gitignored -- upstream's release workflow materialises it from a repository secret.
          # An empty file is enough here: every setting it would carry arrives through the
          # environment instead, and `runtimeConfigValue` checks local.properties *first* and then
          # falls back to the environment. Without it Gradle fails input validation before compiling.
          if (-not (Test-Path "local.properties")) { New-Item -ItemType File "local.properties" | Out-Null }
          $task = if ("${{ inputs.package_as }}" -eq "msi") { ":composeApp:packageReleaseMsi" } else { ":composeApp:createReleaseDistributable" }
          & .\gradlew.bat $task "-Pcompose.desktop.packaging.checkJdkVendor=false" "-Pnuvio.webview2.dir=$env:WEBVIEW2_DIR" --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Gradle failed with exit code $LASTEXITCODE" }

      - name: Collect artifact
        shell: pwsh
        run: |
          $out = "composeApp\build\compose\binaries\main-release"
          $stamp = $env:GITHUB_SHA.Substring(0, 7)
          if ("${{ inputs.package_as }}" -eq "msi") {
            $msi = Get-ChildItem -Path $out -Filter "*.msi" -Recurse | Select-Object -First 1
            if (-not $msi) { throw "No MSI was produced under $out" }
            "ARTIFACT_PATH=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ARTIFACT_NAME=boomio-windows-x64-$stamp.msi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            $appDir = Join-Path $out "app"
            if (-not (Test-Path $appDir)) { throw "No app image was produced at $appDir" }
            # The DLL ships *inside the jar*, under native/windows — that is the entry
            # OverlayWgLibrary extracts on first use. So look in the archive, not for a loose file
            # beside it, which is what the first version of this check did.
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $found = $false
            foreach ($jar in Get-ChildItem -Path $appDir -Filter *.jar -Recurse) {
              $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
              try {
                if ($zip.Entries | Where-Object { $_.FullName -eq "native/windows/overlaywg.dll" }) {
                  $found = $true
                  break
                }
              } finally { $zip.Dispose() }
            }
            if (-not $found) {
              throw "native/windows/overlaywg.dll is not in any jar in the app image - the jar did not pick up overlaywg/build/windows-amd64."
            }
            $zip = Join-Path $env:RUNNER_TEMP "boomio-windows-x64-$stamp.zip"
            Compress-Archive -Path (Join-Path $appDir "*") -DestinationPath $zip -Force
            "ARTIFACT_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ARTIFACT_NAME=boomio-windows-x64-$stamp.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 14
